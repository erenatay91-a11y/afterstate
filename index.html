<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5F9C9D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>BARNEY & the Family</title>
  <style>:root{
  --teal:#5F9C9D;
  --teal-dark:#477F80;
  --teal-soft:#E4F1F0;
  --peach:#E3B4A4;
  --peach-soft:#F8E8E1;
  --violet:#6868AC;
  --violet-soft:#EEEEF8;
  --wine:#894B5D;
  --wine-soft:#F5E7EB;
  --ink:#1E2828;
  --muted:#697474;
  --line:#E6EAE8;
  --paper:#F7F8F6;
  --white:#FFFFFF;
  --shadow:0 12px 32px rgba(31,56,56,.09);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EBEFEC;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
body{min-height:100vh}
#app{min-height:100vh}
.phone-shell{width:min(100%,460px);min-height:100vh;margin:0 auto;background:var(--paper);position:relative;box-shadow:0 0 50px rgba(25,50,50,.12);overflow:hidden}
.screen{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));animation:fade .18s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.welcome{min-height:100vh;background:linear-gradient(180deg,#fff 0%,#fff 70%,#edf6f5 100%);padding:calc(34px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
.welcome:before,.welcome:after{content:"";position:absolute;border-radius:999px;background:var(--teal-soft);z-index:0}
.welcome:before{width:290px;height:290px;right:-140px;top:-120px}.welcome:after{width:280px;height:280px;left:-170px;bottom:-145px;background:var(--peach-soft)}
.brand-lockup{width:100%;max-width:360px;border-radius:26px;display:block;position:relative;z-index:1;margin:8vh auto 18px;box-shadow:var(--shadow)}
.welcome-copy{position:relative;z-index:1;text-align:center;margin:12px auto 26px;max-width:340px}.welcome-copy h1{font-size:30px;line-height:1.05;margin:0 0 12px;font-weight:680;letter-spacing:-.03em}.welcome-copy p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.welcome-actions{position:relative;z-index:1;display:grid;gap:10px}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:700;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px}.btn:active{transform:scale(.99)}.btn.secondary{background:#fff;color:var(--teal-dark);border:1px solid rgba(95,156,157,.45)}.btn.ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--line)}.btn.compact{min-height:42px;padding:10px 13px;border-radius:13px;font-size:13px}.btn.wine{background:var(--wine)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 18px;gap:12px}.brand-mark{width:42px;height:42px;border-radius:14px;object-fit:cover}.top-title{flex:1}.top-title small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}.top-title strong{font-size:19px;letter-spacing:-.02em}.icon-btn{border:0;background:#fff;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;box-shadow:0 5px 16px rgba(36,52,52,.06);color:var(--ink)}
.hero{background:var(--teal);border-radius:26px;color:#fff;padding:20px;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:170px;height:170px;background:rgba(255,255,255,.1);border-radius:50%;right:-75px;top:-55px}.hero-kicker{font-size:12px;opacity:.82;margin-bottom:5px}.hero h2{margin:0;font-size:27px;line-height:1.06;letter-spacing:-.035em;max-width:270px}.hero p{margin:10px 0 0;font-size:13px;line-height:1.45;opacity:.9;max-width:285px}.hero-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px}.hero .btn{background:#fff;color:var(--teal-dark);min-height:42px;padding:10px 14px;font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-head h3{margin:0;font-size:18px;letter-spacing:-.02em}.section-head button{border:0;background:none;color:var(--teal-dark);font-weight:700;font-size:13px}
.alert-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;display:flex;align-items:center;gap:13px;margin-bottom:10px;box-shadow:0 8px 24px rgba(30,50,50,.045)}.alert-card.tint{background:var(--peach-soft);border-color:transparent}.alert-icon{width:42px;height:42px;border-radius:13px;background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center;flex:none}.alert-card.tint .alert-icon{background:#fff;color:var(--wine)}.alert-main{flex:1;min-width:0}.alert-main strong{display:block;font-size:14px;margin-bottom:4px}.alert-main span{display:block;color:var(--muted);font-size:12px;line-height:1.35}.chev{color:#92A09E;flex:none}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:space-between}.quick-card .qicon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-dark)}.quick-card:nth-child(2) .qicon{background:var(--violet-soft);color:var(--violet)}.quick-card:nth-child(3) .qicon{background:var(--peach-soft);color:var(--wine)}.quick-card:nth-child(4) .qicon{background:var(--wine-soft);color:var(--wine)}.quick-card strong{font-size:14px}.quick-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.dog-row{display:flex;gap:10px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.dog-row::-webkit-scrollbar{display:none}.dog-chip{border:0;background:none;padding:0;min-width:58px;text-align:center;color:var(--ink)}.dog-chip img{width:54px;height:54px;border-radius:19px;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(20,40,40,.1)}.dog-chip.active img{outline:2px solid var(--teal)}.dog-chip span{display:block;margin-top:5px;font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin:0 0 14px}.tabs::-webkit-scrollbar{display:none}.pill{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:10px 13px;font-size:12px;font-weight:700;white-space:nowrap}.pill.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.place-card,.service-card,.friend-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:11px}.place-photo,.service-photo{height:145px;width:100%;object-fit:cover;background:linear-gradient(135deg,var(--teal-soft),var(--peach-soft))}.photo-placeholder{height:145px;background:linear-gradient(135deg,#d8ebe8,#f4e2da);display:flex;align-items:end;padding:16px;color:var(--teal-dark);font-size:12px;font-weight:700}.card-body{padding:14px}.card-line{display:flex;justify-content:space-between;align-items:start;gap:10px}.card-body strong{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal-dark);font-weight:700}.tag.peach{background:var(--peach-soft);color:var(--wine)}
.friend-card{padding:14px;display:flex;align-items:center;gap:12px}.friend-card img{width:72px;height:72px;border-radius:22px;object-fit:cover}.friend-info{flex:1}.friend-info strong{display:block}.friend-info small{display:block;color:var(--muted);line-height:1.4;margin-top:4px}.friend-actions{display:flex;gap:7px;margin-top:9px}.mini{border:0;border-radius:11px;padding:8px 10px;font-size:11px;font-weight:700;background:var(--teal);color:#fff}.mini.outline{background:#fff;border:1px solid var(--line);color:var(--teal-dark)}
.grid-services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.service-card{margin:0}.service-card .service-photo{height:112px}.service-card .card-body{padding:12px}.service-card button{width:100%;margin-top:10px}
.care-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.care-item{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;min-height:132px;text-align:left}.care-item .care-icon{width:38px;height:38px;border-radius:12px;background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center;margin-bottom:15px}.care-item:nth-child(2n) .care-icon{background:var(--peach-soft);color:var(--wine)}.care-item strong{display:block;font-size:14px}.care-item small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:5px}
.profile-top{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;align-items:center;gap:13px}.profile-top img{width:76px;height:76px;border-radius:24px;object-fit:cover}.profile-top .info{flex:1}.profile-top h2{font-size:21px;margin:0 0 4px}.profile-top p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.profile-actions{display:flex;gap:8px;margin-top:12px}
.dog-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dog-card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;text-align:left;position:relative}.dog-card img{width:100%;height:118px;object-fit:cover}.dog-card .dinfo{padding:11px}.dog-card strong{font-size:14px}.dog-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.add-dog{border:1px dashed rgba(95,156,157,.55);background:var(--teal-soft);display:grid;place-items:center;text-align:center;min-height:174px;color:var(--teal-dark);font-weight:700}
.food-card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:11px}.food-top{display:flex;gap:12px;align-items:start}.food-icon{width:50px;height:58px;border-radius:16px;background:var(--peach-soft);display:grid;place-items:center;color:var(--wine);flex:none}.food-main{flex:1}.food-main strong{display:block;font-size:15px}.food-main small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}.avatar-stack{display:flex;margin-top:10px}.avatar-stack img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-6px}.avatar-stack img:first-child{margin-left:0}.food-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.stat{background:var(--paper);border-radius:13px;padding:10px}.stat span{display:block;font-size:10px;color:var(--muted)}.stat strong{font-size:13px;margin-top:3px;display:block}.progress{height:7px;background:#E9ECEA;border-radius:999px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--teal);border-radius:999px}.deal-banner{background:var(--wine-soft);border-radius:16px;padding:12px;margin-top:12px}.deal-banner strong{display:block;color:var(--wine);font-size:12px}.deal-banner span{display:block;font-size:11px;color:#775966;margin-top:3px;line-height:1.4}.food-actions{display:flex;gap:8px;margin-top:11px}.food-actions .btn{flex:1}
.price-list{margin-top:12px;display:grid;gap:8px}.price-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.retailer{font-size:12px;font-weight:800}.price{font-size:12px;font-weight:800}.old-price{font-size:10px;color:#9AA2A0;text-decoration:line-through}.price-row .mini{padding:7px 9px}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,460px);background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:50}.nav-btn{border:0;background:none;color:#88918F;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700}.nav-btn.active{color:var(--teal-dark)}.nav-btn svg{width:21px;height:21px}
.empty{padding:28px 18px;text-align:center;border:1px dashed #ccd5d2;border-radius:20px;background:#fff}.empty strong{display:block}.empty p{font-size:12px;color:var(--muted);line-height:1.45;margin:7px auto 14px;max-width:280px}
.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,16px);width:min(calc(100% - 36px),410px);background:#1E2828;color:#fff;padding:13px 15px;border-radius:14px;font-size:12px;font-weight:650;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:0 12px 34px rgba(0,0,0,.22)}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,30,30,.38);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}.modal{width:min(100%,460px);max-height:88vh;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));overflow:auto;animation:sheet .22s ease}@keyframes sheet{from{transform:translateY(30%);opacity:.6}to{transform:none;opacity:1}}.grab{width:42px;height:5px;border-radius:999px;background:#d8dddb;margin:2px auto 15px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{margin:0;font-size:20px}.close{border:0;background:var(--paper);width:38px;height:38px;border-radius:12px}.form-grid{display:grid;gap:11px}.field label{display:block;font-size:11px;font-weight:800;color:#596260;margin:0 0 6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 12px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--teal)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal .btn{width:100%;margin-top:10px}
.map-box{height:210px;border-radius:22px;background:linear-gradient(135deg,#E4F1F0,#F5F0EA);position:relative;overflow:hidden;border:1px solid #dfe8e5;margin-bottom:12px}.map-box:before{content:"";position:absolute;inset:0;background-image:linear-gradient(35deg,transparent 46%,rgba(255,255,255,.9) 47% 53%,transparent 54%),linear-gradient(145deg,transparent 44%,rgba(255,255,255,.75) 45% 51%,transparent 52%);background-size:120px 120px,140px 140px;opacity:.85}.map-pin{position:absolute;width:36px;height:36px;border-radius:50% 50% 50% 10%;transform:rotate(-45deg);background:var(--teal);display:grid;place-items:center;color:#fff;box-shadow:0 5px 14px rgba(50,80,80,.18)}.map-pin svg{transform:rotate(45deg);width:16px;height:16px}.pin1{left:22%;top:32%}.pin2{left:62%;top:52%;background:var(--wine)}.pin3{left:70%;top:17%;background:var(--violet)}.pin4{left:38%;top:66%;background:var(--peach);color:var(--wine)}.you{position:absolute;left:48%;top:43%;width:20px;height:20px;background:#2F7BEA;border:4px solid #fff;border-radius:50%;box-shadow:0 2px 10px rgba(47,123,234,.35)}
.small-note{font-size:11px;color:var(--muted);line-height:1.45}.divider{height:1px;background:var(--line);margin:16px 0}.share-card{background:var(--teal-soft);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}.share-card .qicon{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--teal-dark);display:grid;place-items:center}.share-card strong{display:block;font-size:13px}.share-card span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
@media(min-width:700px){body{padding:24px 0}.phone-shell{min-height:860px;border-radius:32px;overflow:hidden}.screen,.welcome{min-height:860px}.bottom-nav{bottom:24px;border-radius:0 0 32px 32px}}
</style>
</head>

const blankState={started:false,demo:false,route:'home',selectedDog:null,user:{name:'',city:'İstanbul'},dogs:[],pantry:{},prices:{},bookings:[],reminders:[]};
let state=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem('barneyState'));return s||structuredClone(blankState)}catch{return structuredClone(blankState)}}
function save(){localStorage.setItem('barneyState',JSON.stringify(state))}
function reset(){localStorage.removeItem('barneyState');state=structuredClone(blankState);render()}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function selectedDog(){return state.dogs.find(d=>d.id===state.selectedDog)||state.dogs[0]}
function groupFoods(){
  const groups={};
  state.dogs.forEach(d=>{if(!groups[d.food])groups[d.food]={name:d.food,dogs:[],daily:0,bagKg:d.bagKg};groups[d.food].dogs.push(d);groups[d.food].daily+=Number(d.dailyG)||0});
  return Object.values(groups).map(g=>{const remaining=state.pantry[g.name] ?? g.bagKg;const days=Math.max(0,Math.floor((remaining*1000)/(g.daily||1)));return {...g,remaining,days}})
}
function priceInfo(food){return state.prices[food]||{baseline:0,current:0,retailers:[]}}
function money(v){return new Intl.NumberFormat('tr-TR').format(Math.round(v))+' TL'}

function bottomNav(){
  const items=[['home','Ana Sayfa','home'],['explore','Keşfet','compass'],['care','Bakım','heart'],['services','Hizmetler','briefcase'],['profile','Profil','user']];
  return `<nav class="bottom-nav">${items.map(([r,l,i])=>`<button class="nav-btn ${state.route===r?'active':''}" data-route="${r}">${icon(i)}<span>${l}</span></button>`).join('')}</nav>`
}
function homeView(){
  if(!state.dogs.length) return header('Hoş geldin')+emptyDog();
  const dogs=state.dogs; const foods=groupFoods(); const urgent=foods.sort((a,b)=>a.days-b.days)[0];
  const p=urgent?priceInfo(urgent.name):null; const saving=p&&p.baseline?Math.round((1-p.current/p.baseline)*100):0;
  return `${header('Günaydın, '+(state.user.name||''))}
    <section class="hero"><div class="hero-kicker">Bugünün özeti</div><h2>${dogs.length===1?dogs[0].name+' için her şey yolunda.':dogs.length+' köpeğin için bugün 3 konu var.'}</h2><p>Yaklaşan bakım işlerini ve mama durumunu tek yerden takip et.</p><div class="hero-line"><button class="btn" data-route="profile">Profili aç ${icon('chevron',16)}</button><span style="font-size:12px;opacity:.85">${foods.length} mama planı</span></div></section>
    ${dogs.length>1?`<div class="dog-row">${dogs.map(d=>dogChip(d)).join('')}</div>`:''}
    <div class="section-head"><h3>Bugün</h3><button data-route="care">Tümünü gör</button></div>
    ${urgent?`<button class="alert-card tint" data-action="food-detail" data-food="${esc(urgent.name)}"><span class="alert-icon">${icon('food')}</span><span class="alert-main"><strong>${urgent.name}</strong><span>Yaklaşık ${urgent.days} günlük mama kaldı. ${saving>10?`Fiyat son döneme göre %${saving} daha düşük.`:''}</span></span><span class="chev">${icon('chevron',18)}</span></button>`:''}
    <button class="alert-card" data-route="care"><span class="alert-icon">${icon('calendar')}</span><span class="alert-main"><strong>Obi için veteriner kontrolü</strong><span>Yarın, 10:30. Kaydı ve geçmişi Bakım bölümünde görebilirsin.</span></span><span class="chev">${icon('chevron',18)}</span></button>
    <button class="alert-card" data-route="services"><span class="alert-icon">${icon('scissors')}</span><span class="alert-main"><strong>Maya için grooming</strong><span>Son bakımdan bu yana 31 gün geçti. Yakındaki groomer'lara bak.</span></span><span class="chev">${icon('chevron',18)}</span></button>
    <div class="section-head"><h3>Hızlı erişim</h3></div>
    <div class="quick-grid">
      <button class="quick-card" data-explore="walk"><span class="qicon">${icon('walk')}</span><span><strong>WalkBuddy</strong><small>Yakındaki yürüyüş eşleri</small></span></button>
      <button class="quick-card" data-explore="vet"><span class="qicon">${icon('steth')}</span><span><strong>Yakındaki veteriner</strong><small>Konuma göre keşfet</small></span></button>
      <button class="quick-card" data-route="services"><span class="qicon">${icon('briefcase')}</span><span><strong>Bakıcı ve walker</strong><small>Hizmet bul ve talep gönder</small></span></button>
      <button class="quick-card" data-route="profile"><span class="qicon">${icon('tag')}</span><span><strong>Mama fırsatları</strong><small>Kullandığın ürünlerde fiyat izle</small></span></button>
    </div>`
}
function dogChip(d){return `<button class="dog-chip ${state.selectedDog===d.id?'active':''}" data-dog="${d.id}"><img src="${d.image}" alt="${esc(d.name)}"><span>${esc(d.name)}</span></button>`}

function exploreView(){
  return `${header('Keşfet','Arkadaşlar, yürüyüşler ve yerler')}
    <div class="tabs"><button class="pill active" data-exp-tab="places">Yakınında</button><button class="pill" data-exp-tab="walk">WalkBuddy</button><button class="pill" data-exp-tab="friends">Köpek arkadaşları</button></div>
    <div id="explore-content">${explorePlaces()}</div>`
}
function explorePlaces(){return `<div class="map-box"><span class="you"></span><span class="map-pin pin1">${icon('steth',16)}</span><span class="map-pin pin2">${icon('paw',16)}</span><span class="map-pin pin3">${icon('house',16)}</span><span class="map-pin pin4">${icon('map',16)}</span></div>
  ${place('Minoa Village','Köpek dostu kafe','1,2 km','İç mekan uygun','Su kabı')}
  ${place('Maçka Demokrasi Parkı','Park ve yürüyüş alanı','2,4 km','Geniş alan','Yürüyüş')}
  ${place('Pera Pet Hotel','Köpek dostu konaklama','3,1 km','Çoklu köpek','Rezervasyon')}`}
function place(name,type,dist,t1,t2){return `<article class="place-card"><div class="photo-placeholder">Gerçek mekan fotoğrafı alanı</div><div class="card-body"><div class="card-line"><div><strong>${name}</strong><div class="meta">${type} · ${dist}</div></div><button class="icon-btn" style="width:34px;height:34px" data-action="favorite">${icon('heart',17)}</button></div><div class="tags"><span class="tag">${t1}</span><span class="tag peach">${t2}</span></div></div></article>`}
function walkView(){return `${friend('Obi ile yürüyüş','Bugün 18:30 · Bebek sahil · 45 dk',1)}${friend('Maya ve Lokum','Yarın 09:00 · Maçka Parkı · Sakin tempo',3)}<button class="btn" style="width:100%" data-action="create-walk">Yürüyüş oluştur</button>`}
function friendsView(){return `${friend('Paco','Pug · 4 yaş · 1,1 km',2)}${friend('Moka','Cocker Spaniel · 3 yaş · 1,8 km',4)}${friend('Loki','Labrador · 5 yaş · 2,3 km',5)}`}
function friend(name,sub,i){return `<article class="friend-card"><img src="${IMG(i)}" alt="${esc(name)}"><div class="friend-info"><strong>${name}</strong><small>${sub}</small><div class="friend-actions"><button class="mini" data-action="friend-request">Bağlantı kur</button><button class="mini outline" data-action="message">Mesaj</button></div></div></article>`}

function careView(){
  if(!state.dogs.length) return header('Bakım')+emptyDog(); const d=selectedDog();
  return `${header('Bakım','Sağlık ve rutinler')}${state.dogs.length>1?`<div class="dog-row">${state.dogs.map(x=>dogChip(x)).join('')}</div>`:''}
    <div class="section-head"><h3>${esc(d.name)}</h3><button data-action="share-health">Veterinerle paylaş</button></div>
    <div class="care-grid">
      ${careItem('syringe','Aşılar','Sıradaki: '+d.vaccination,'vaccines')}
      ${careItem('pills','İlaçlar','Aktif plan yok','meds')}
      ${careItem('steth','Veteriner geçmişi','Son ziyaret 2 ay önce','vet-history')}
      ${careItem('scissors','Grooming','Önerilen: '+d.grooming,'grooming')}
      ${careItem('chart','Kilo takibi',d.weight+' kg · son kayıt','weight')}
      ${careItem('folder','Sağlık dosyaları','Tahlil, röntgen ve notlar','records')}
    </div>
    <div class="section-head"><h3>Yaklaşanlar</h3></div>
    <button class="alert-card"><span class="alert-icon">${icon('calendar')}</span><span class="alert-main"><strong>Parazit uygulaması</strong><span>12 gün sonra. Takvime eklendi.</span></span><span class="chev">${icon('chevron',18)}</span></button>
    <div class="share-card"><span class="qicon">${icon('share')}</span><span><strong>Sağlık pasaportunu paylaş</strong><span>Veteriner veya bakıcı için tek bağlantıda özet oluştur.</span></span></div>`
}
function careItem(ic,title,sub,action){return `<button class="care-item" data-care="${action}"><span class="care-icon">${icon(ic)}</span><strong>${title}</strong><small>${sub}</small></button>`}

function servicesView(){
 const cards=[['walk','Dog Walker','30, 60 veya 90 dk yürüyüş',1],['user','Pet Sitter','Evde veya bakıcının evinde',2],['scissors','Grooming','Bakım, tırnak ve temizlik',3],['book','Eğitmen','Yavru, temel ve davranış eğitimi',4],['car','Pet Taksi','Veteriner ve bakım ulaşımı',5],['house','Pansiyon','Doğrulanmış bakım seçenekleri',6]];
 return `${header('Hizmetler','Güvendiğin kişiler tek yerde')}<div class="grid-services">${cards.map(([ic,t,s,i])=>`<article class="service-card"><img class="service-photo" src="${IMG(i)}" alt="${t}"><div class="card-body"><div class="qicon" style="color:var(--teal-dark);margin-bottom:8px">${icon(ic)}</div><strong>${t}</strong><div class="meta">${s}</div><button class="mini" data-service="${t}">Talep oluştur</button></div></article>`).join('')}</div>`
}

function profileView(){
  if(!state.dogs.length) return header('Profil')+emptyDog();
  const d=selectedDog(); const plural=state.dogs.length>1;
  return `${header('Profil','Hesap, köpekler ve mama')}
    <div class="profile-top"><img src="${d.image}" alt="${esc(d.name)}"><div class="info"><h2>${esc(d.name)}</h2><p>${esc(d.breed)} · ${esc(d.age)} · ${d.weight} kg</p><div class="profile-actions"><button class="mini outline" data-action="edit-dog">Düzenle</button><button class="mini" data-action="add-dog">Köpek ekle</button></div></div></div>
    ${plural?`<div class="section-head"><h3>Köpeklerim</h3><button data-action="add-dog">Yeni ekle</button></div><div class="dog-list">${state.dogs.map(x=>`<button class="dog-card" data-dog="${x.id}"><img src="${x.image}" alt="${esc(x.name)}"><div class="dinfo"><strong>${esc(x.name)}</strong><small>${esc(x.breed)} · ${x.weight} kg</small></div></button>`).join('')}<button class="dog-card add-dog" data-action="add-dog">${icon('plus',28)}<span>Yeni köpek ekle</span></button></div>`:''}
    <div class="section-head"><h3>${plural?'Mama planları':'Mama planı'}</h3><button data-action="food-settings">Ayarla</button></div>
    ${groupFoods().map(foodCard).join('')}
    <div class="section-head"><h3>Hesap</h3></div>
    <button class="alert-card" data-action="account"><span class="alert-icon">${icon('user')}</span><span class="alert-main"><strong>${esc(state.user.name||'Hesap sahibi')}</strong><span>Üyelik, bildirimler ve aile paylaşımı</span></span><span class="chev">${icon('chevron',18)}</span></button>
    <button class="btn ghost" style="width:100%;margin-top:12px" data-action="reset">Demo verisini sıfırla</button>`
}
function foodCard(g){const p=priceInfo(g.name);const saving=p.baseline?Math.max(0,Math.round((1-p.current/p.baseline)*100)):0;const bagTotal=g.bagKg*1000;const pct=Math.min(100,Math.max(4,(g.remaining*1000/bagTotal)*100));return `<article class="food-card"><div class="food-top"><span class="food-icon">${icon('food',24)}</span><div class="food-main"><strong>${esc(g.name)}</strong><small>${g.dogs.length===1?g.dogs[0].name+' kullanıyor':g.dogs.length+' köpek kullanıyor'} · toplam ${g.daily} g/gün</small><div class="avatar-stack">${g.dogs.map(d=>`<img src="${d.image}" alt="${esc(d.name)}" title="${esc(d.name)}">`).join('')}</div></div></div><div class="food-stats"><div class="stat"><span>Kalan</span><strong>${g.remaining.toFixed(1)} kg</strong></div><div class="stat"><span>Tahmini</span><strong>${g.days} gün</strong></div><div class="stat"><span>En iyi fiyat</span><strong>${p.current?money(p.current):'Takipte'}</strong></div></div><div class="progress"><i style="width:${pct}%"></i></div>${saving>=8?`<div class="deal-banner"><strong>Fiyat fırsatı: %${saving} düşüş</strong><span>Şu an ihtiyacın acil değil, ancak kullandığın ürün son döneme göre daha uygun.</span></div>`:''}<div class="food-actions"><button class="btn compact secondary" data-action="food-detail" data-food="${esc(g.name)}">Detay</button><button class="btn compact" data-action="refresh-price" data-food="${esc(g.name)}">Fiyatları yenile</button></div></article>`}
function emptyDog(){return `<div class="empty"><strong>İlk köpeğini ekle</strong><p>Tek köpekle başla. İkinci bir köpek eklersen uygulama çoklu köpek ve ortak mama planlarını otomatik açar.</p><button class="btn" data-action="add-dog">Köpek ekle</button></div>`}

function routeView(route){return ({home:homeView,explore:exploreView,care:careView,services:servicesView,profile:profileView}[route]||homeView)()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function bind(){
  $$('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;save();render()});
  $$('[data-dog]').forEach(b=>b.onclick=()=>{state.selectedDog=Number(b.dataset.dog);save();render()});
  $$('[data-action]').forEach(b=>b.onclick=(e)=>handleAction(b.dataset.action,b,e));
  $$('[data-service]').forEach(b=>b.onclick=()=>serviceModal(b.dataset.service));
  $$('[data-care]').forEach(b=>b.onclick=()=>careModal(b.dataset.care));
  $$('[data-exp-tab]').forEach(b=>b.onclick=()=>{ $$('[data-exp-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#explore-content').innerHTML=b.dataset.expTab==='walk'?walkView():b.dataset.expTab==='friends'?friendsView():explorePlaces();bindDynamicExplore();});
  $$('[data-explore]').forEach(b=>b.onclick=()=>{state.route='explore';save();render();setTimeout(()=>{const t=$(`[data-exp-tab="${b.dataset.explore==='walk'?'walk':'places'}"]`);t&&t.click()},0)});
}
function bindDynamicExplore(){
  $$('[data-action]', $('#explore-content')).forEach(b=>b.onclick=(e)=>handleAction(b.dataset.action,b,e));
}
function handleAction(action,el){
  if(action==='start-new'){state=structuredClone(blankState);state.started=true;state.user.name='';save();render();setTimeout(()=>addDogModal(true),150)}
  else if(action==='open-demo'){state=structuredClone(demoState);save();render()}
  else if(action==='notifications') notificationsModal();
  else if(action==='add-dog') addDogModal(false);
  else if(action==='edit-dog') editDogModal(selectedDog());
  else if(action==='food-detail') foodDetailModal(el.dataset.food);
  else if(action==='refresh-price') refreshPrices(el.dataset.food);
  else if(action==='food-settings') foodSettingsModal();
  else if(action==='favorite') toast('Favorilere eklendi.');
  else if(action==='friend-request') toast('Bağlantı isteği gönderildi.');
  else if(action==='message') toast('Mesaj ekranı açıldı.');
  else if(action==='create-walk') walkModal();
  else if(action==='share-health') shareHealthModal();
  else if(action==='account') accountModal();
  else if(action==='reset'){if(confirm('Uygulamadaki demo verileri silinsin mi?'))reset()}
}
function openModal(html){modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="grab"></div>${html}</section></div>`;$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};$$('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){modalRoot.innerHTML=''}
function modalHead(title){return `<div class="modal-head"><h3>${title}</h3><button class="close" data-close>${icon('x')}</button></div>`}

function addDogModal(first=false){openModal(`${modalHead(first?'İlk köpeğini ekle':'Yeni köpek ekle')}<form id="dog-form" class="form-grid"><div class="field"><label>Adı</label><input name="name" required placeholder="Örn. Barney"></div><div class="form-row"><div class="field"><label>Irk</label><input name="breed" required placeholder="Pug"></div><div class="field"><label>Kilo</label><input name="weight" type="number" step="0.1" required placeholder="10.2"></div></div><div class="field"><label>Yaş</label><input name="age" placeholder="3 yaş"></div><div class="field"><label>Yediği mama</label><input name="food" required placeholder="Royal Canin Mini Adult"></div><div class="form-row"><div class="field"><label>Paket kg</label><input name="bag" type="number" step="0.1" value="12"></div><div class="field"><label>Günlük gram</label><input name="daily" type="number" value="120"></div></div><button class="btn" type="submit">Kaydet</button></form>`);$('#dog-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const id=(Math.max(0,...state.dogs.map(d=>d.id))+1);const img=IMG(((id-1)%6)+1);const dog={id,name:f.get('name'),breed:f.get('breed'),weight:Number(f.get('weight')),age:f.get('age')||'Yaş bilgisi yok',food:f.get('food'),bagKg:Number(f.get('bag'))||12,dailyG:Number(f.get('daily'))||120,image:img,vaccination:'30 gün',grooming:'21 gün'};state.dogs.push(dog);state.selectedDog=id;if(state.pantry[dog.food]==null)state.pantry[dog.food]=dog.bagKg;if(!state.prices[dog.food])state.prices[dog.food]={baseline:2500,current:2390,retailers:[['Hepsiburada',2390],['Trendyol',2420],['N11',2480]]};state.started=true;save();closeModal();render();toast(dog.name+' eklendi.');}}
function editDogModal(d){openModal(`${modalHead(d.name+' profilini düzenle')}<form id="edit-dog" class="form-grid"><div class="field"><label>Adı</label><input name="name" value="${esc(d.name)}"></div><div class="form-row"><div class="field"><label>Irk</label><input name="breed" value="${esc(d.breed)}"></div><div class="field"><label>Kilo</label><input name="weight" type="number" step="0.1" value="${d.weight}"></div></div><div class="field"><label>Yaş</label><input name="age" value="${esc(d.age)}"></div><button class="btn" type="submit">Değişiklikleri kaydet</button></form>`);$('#edit-dog').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);Object.assign(d,{name:f.get('name'),breed:f.get('breed'),weight:Number(f.get('weight')),age:f.get('age')});save();closeModal();render();toast('Profil güncellendi.')}}
function foodDetailModal(food){const g=groupFoods().find(x=>x.name===food);if(!g)return;const p=priceInfo(food);openModal(`${modalHead(food)}<div class="food-card" style="margin:0"><div class="food-top"><span class="food-icon">${icon('food',24)}</span><div class="food-main"><strong>${esc(food)}</strong><small>${g.dogs.map(d=>d.name).join(', ')} · ${g.daily} g/gün toplam tüketim</small></div></div><div class="food-stats"><div class="stat"><span>Kalan</span><strong>${g.remaining.toFixed(1)} kg</strong></div><div class="stat"><span>Tahmini bitiş</span><strong>${g.days} gün</strong></div><div class="stat"><span>Paket</span><strong>${g.bagKg} kg</strong></div></div></div><div class="section-head"><h3>Fiyat karşılaştırması</h3><button id="refresh-modal">Yenile</button></div><div class="price-list">${p.retailers.map(([r,v])=>priceRow(r,v,p.baseline,food)).join('')}</div><p class="small-note">Bu prototipte fiyatlar demo verisidir. Canlı sürümde affiliate/API bağlantılarıyla otomatik güncellenir ve satın alma bağlantısı ilgili mağazaya yönlendirir.</p>`);$('#refresh-modal').onclick=()=>refreshPrices(food,true);$$('[data-buy]').forEach(b=>b.onclick=()=>{window.open(retailerUrl(b.dataset.buy,food),'_blank');toast('Mağaza açılıyor.')});}
function priceRow(r,v,old,food){return `<div class="price-row"><div><div class="retailer">${r}</div><div class="old-price">${money(old)}</div></div><div class="price">${money(v)}</div><button class="mini" data-buy="${r}">Git</button></div>`}
function retailerUrl(r,food){const q=encodeURIComponent(food);if(r==='Trendyol')return `https://www.trendyol.com/sr?q=${q}`;if(r==='N11')return `https://www.n11.com/arama?q=${q}`;return `https://www.hepsiburada.com/ara?q=${q}`}
function refreshPrices(food,reopen=false){const p=state.prices[food];if(!p)return;const factor=.97+Math.random()*.04;p.retailers=p.retailers.map(([r,v])=>[r,Math.max(1,Math.round(v*factor/10)*10)]);p.current=Math.min(...p.retailers.map(x=>x[1]));save();toast('Fiyatlar yenilendi.');if(reopen){closeModal();setTimeout(()=>foodDetailModal(food),80)}else render()}
function foodSettingsModal(){const foods=groupFoods();openModal(`${modalHead('Mama planları')}<p class="small-note">Aynı mamayı yiyen köpekleri ayrıca grup kurmadan otomatik bir arada gösteriyoruz.</p>${foods.map(g=>`<div class="alert-card"><span class="alert-icon">${icon('food')}</span><span class="alert-main"><strong>${esc(g.name)}</strong><span>${g.dogs.map(d=>d.name).join(', ')} · ${g.daily} g/gün</span></span></div>`).join('')}<button class="btn" id="food-add">Yeni mama bilgisi ekle</button>`);$('#food-add').onclick=()=>{closeModal();addDogModal(false)}}
function serviceModal(name){openModal(`${modalHead(name)}<div class="form-grid"><div class="field"><label>Hangi köpek?</label><select id="service-dog">${state.dogs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Tarih ve saat</label><input id="service-date" type="datetime-local"></div><div class="field"><label>Not</label><input id="service-note" placeholder="Kısa bir not ekle"></div><button class="btn" id="service-send">Talep gönder</button></div>`);$('#service-send').onclick=()=>{state.bookings.push({name,dog:Number($('#service-dog').value),date:$('#service-date').value});save();closeModal();toast(name+' talebi oluşturuldu.')}}
function careModal(type){const d=selectedDog();const titles={vaccines:'Aşılar',meds:'İlaçlar','vet-history':'Veteriner geçmişi',grooming:'Grooming',weight:'Kilo takibi',records:'Sağlık dosyaları'};openModal(`${modalHead(titles[type]||'Bakım')}<div class="alert-card"><span class="alert-icon">${icon(type==='weight'?'chart':type==='meds'?'pills':'calendar')}</span><span class="alert-main"><strong>${esc(d.name)}</strong><span>${type==='weight'?d.weight+' kg · son kayıt bugün':'Kayıtlar burada kronolojik olarak tutulur.'}</span></span></div><button class="btn" id="add-care">Yeni kayıt ekle</button>`);$('#add-care').onclick=()=>{closeModal();toast('Yeni kayıt eklendi.')}}
function walkModal(){openModal(`${modalHead('Yürüyüş oluştur')}<div class="form-grid"><div class="field"><label>Köpek</label><select>${state.dogs.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>Yer</label><input value="Bebek sahil"></div><div class="field"><label>Tarih ve saat</label><input type="datetime-local"></div><button class="btn" id="create-walk-go">Yayınla</button></div>`);$('#create-walk-go').onclick=()=>{closeModal();toast('Yürüyüş yayınlandı.')}}
function shareHealthModal(){const d=selectedDog();openModal(`${modalHead('Sağlık pasaportu')}<div class="profile-top"><img src="${d.image}" alt="${esc(d.name)}"><div class="info"><h2>${esc(d.name)}</h2><p>${esc(d.breed)} · ${d.age} · ${d.weight} kg</p></div></div><div class="divider"></div><div class="alert-card"><span class="alert-icon">${icon('share')}</span><span class="alert-main"><strong>Paylaşılabilir özet hazır</strong><span>Aşılar, ilaçlar, son kilo ve veteriner notlarını içerir.</span></span></div><button class="btn" id="copy-share">Bağlantıyı kopyala</button>`);$('#copy-share').onclick=()=>{navigator.clipboard?.writeText('https://barney.family/health/demo-'+d.id);toast('Bağlantı kopyalandı.')}}
function notificationsModal(){openModal(`${modalHead('Bildirimler')}<div class="alert-card tint"><span class="alert-icon">${icon('tag')}</span><span class="alert-main"><strong>Mamada fiyat düşüşü</strong><span>Kullandığın üründe yeni fiyat fırsatı var.</span></span></div><div class="alert-card"><span class="alert-icon">${icon('calendar')}</span><span class="alert-main"><strong>Veteriner kontrolü</strong><span>Obi için yarın 10:30.</span></span></div>`)}
function accountModal(){openModal(`${modalHead('Hesap')}<div class="form-grid"><div class="field"><label>Ad</label><input id="acc-name" value="${esc(state.user.name)}"></div><div class="field"><label>Şehir</label><input id="acc-city" value="${esc(state.user.city)}"></div><button class="btn" id="acc-save">Kaydet</button></div>`);$('#acc-save').onclick=()=>{state.user.name=$('#acc-name').value;state.user.city=$('#acc-city').value;save();closeModal();render();toast('Hesap güncellendi.')}}

render();
</script>
</body>
</html>
