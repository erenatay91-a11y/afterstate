<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#5F9C9D"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>BARNEY & the Family</title>
<style>
:root{
  --g:#5F9C9D;
  --gd:#477F80;
  --gs:#EAF3F2;
  --peach:#E3B4A4;
  --violet:#6868AC;
  --wine:#894B5D;
  --ink:#1F2929;
  --muted:#7B8583;
  --line:#E7ECEA;
  --bg:#F7F9F8;
  --white:#FFFFFF;
  --shadow:0 10px 30px rgba(35,58,58,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:#EDF1EF;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
body{min-height:100vh}
.app{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--bg);position:relative;padding-bottom:96px;overflow-x:hidden}
.screen{display:none;padding:18px 16px 28px}
.screen.active{display:block}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:sticky;top:0;background:rgba(247,249,248,.96);backdrop-filter:blur(16px);z-index:30;border-bottom:1px solid var(--line)}
.brand-img{width:112px;height:38px;border-radius:11px;object-fit:cover;object-position:center}
.top-action{border:0;background:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gd);box-shadow:var(--shadow)}
.title{font-size:29px;letter-spacing:-.04em;margin:3px 0 6px}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 18px rgba(35,58,58,.045)}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head h2{font-size:18px;margin:0;letter-spacing:-.02em}
.link{border:0;background:none;padding:0;color:var(--gd);font-size:13px;font-weight:750}
.dog-switch{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 5px 18px rgba(35,58,58,.045)}
.avatar{width:54px;height:54px;border-radius:17px;object-fit:cover;background:#e9eceb;flex:none}
.avatar.lg{width:96px;height:96px;border-radius:28px}
.avatar.sm{width:46px;height:46px;border-radius:14px}
.grow{flex:1;min-width:0}
.dog-switch b{display:block;font-size:16px}
.dog-switch span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.chev{color:#A3ADAA;font-size:22px}
.radar-card{padding:14px;overflow:hidden}
.radar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.radar-top b{font-size:18px}
.radar-top small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.map{height:230px;border-radius:18px;position:relative;overflow:hidden;background:#EEF4F2;border:1px solid #E1E9E6}
.map:before{content:"";position:absolute;inset:-20px;background:
linear-gradient(28deg,transparent 46%,rgba(255,255,255,.95) 47% 53%,transparent 54%),
linear-gradient(145deg,transparent 42%,rgba(255,255,255,.8) 43% 50%,transparent 51%);
background-size:130px 130px,160px 160px;opacity:.9}
.map:after{content:"";position:absolute;width:180px;height:70px;border-radius:50%;background:#D9ECE7;left:-45px;bottom:25px;transform:rotate(-10deg);opacity:.7}
.you{position:absolute;width:18px;height:18px;border-radius:50%;background:#2D7FF0;border:4px solid #fff;left:49%;top:46%;z-index:4;box-shadow:0 3px 9px rgba(45,127,240,.28)}
.pin{position:absolute;width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;z-index:5;box-shadow:0 6px 14px rgba(35,58,58,.14);color:#fff}
.pin svg{width:16px;height:16px}
.p1{left:18%;top:23%;background:var(--g)}
.p2{right:17%;top:18%;background:var(--violet)}
.p3{left:27%;bottom:15%;background:var(--wine)}
.p4{right:21%;bottom:18%;background:var(--peach);color:#69453D}
.radar-counts{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.count{font-size:11px;padding:7px 9px;border-radius:999px;background:var(--gs);color:var(--gd);font-weight:750}
.primary,.secondary{border:0;border-radius:14px;min-height:46px;padding:12px 15px;font-weight:780}
.primary{background:var(--g);color:#fff}
.secondary{background:#fff;color:var(--gd);border:1px solid var(--line)}
.full{width:100%}
.today{display:grid;gap:8px}
.today-row{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 14px;display:flex;align-items:center;gap:11px;text-align:left}
.today-row .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gs);color:var(--gd);flex:none}
.today-row:nth-child(2) .ico{background:#F8E9E3;color:#7B4C40}
.today-row:nth-child(3) .ico{background:#EEEEF9;color:var(--violet)}
.today-row b{display:block;font-size:14px}
.today-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.footer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);height:76px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;padding:8px 22px calc(9px + env(safe-area-inset-bottom));z-index:80}
.nav{border:0;background:none;color:#929A98;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700}
.nav.active{color:var(--gd)}
.nav svg{width:22px;height:22px}
.super-wrap{position:relative;display:flex;justify-content:center}
.super-btn{position:absolute;bottom:10px;width:62px;height:62px;border-radius:50%;border:5px solid var(--bg);background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 10px 25px rgba(71,127,128,.28)}
.super-btn svg{width:30px;height:30px}
.profile-hero{padding:16px;display:flex;align-items:center;gap:14px}
.profile-hero h2{margin:0 0 4px;font-size:22px}
.profile-hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.profile-hero .primary{margin-top:12px;min-height:40px;padding:9px 12px;font-size:12px}
.dogs-strip{display:flex;gap:12px;overflow:auto;padding:2px 1px 4px;scrollbar-width:none}
.dogs-strip::-webkit-scrollbar{display:none}
.dog-mini{border:0;background:none;padding:0;min-width:64px;text-align:center}
.dog-mini img{width:58px;height:58px;border-radius:18px;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(35,58,58,.08)}
.dog-mini.active img{outline:2px solid var(--g)}
.dog-mini span{font-size:11px;display:block;margin-top:6px;color:var(--ink)}
.add-dog{min-width:58px;height:58px;border-radius:18px;border:1px dashed #9FC3BF;background:var(--gs);color:var(--gd);display:grid;place-items:center}
.settings{display:grid;gap:8px}
.setting{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:11px;text-align:left}
.setting svg{width:20px;height:20px;color:var(--gd)}
.setting b{font-size:13px}
.setting .chev{margin-left:auto}
.overlay{position:fixed;inset:0;background:rgba(22,35,35,.35);display:none;align-items:flex-end;justify-content:center;z-index:120}
.overlay.open{display:flex}
.sheet{width:min(100%,430px);background:#fff;border-radius:28px 28px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;background:#D9DEDC;border-radius:999px;margin:2px auto 16px}
.sheet h3{font-size:22px;margin:0 0 4px}
.sheet .sub{margin-bottom:15px}
.super-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.module{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;text-align:left;min-height:142px;display:flex;flex-direction:column;justify-content:space-between}
.module.primary-module{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 10px 25px rgba(71,127,128,.18)}
.module .micon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--gs);color:var(--gd)}
.module.primary-module .micon{background:rgba(255,255,255,.18);color:#fff}
.module:nth-child(2) .micon{background:#F8E9E3;color:#7B4C40}
.module:nth-child(3) .micon{background:#EEEEF9;color:var(--violet)}
.module:nth-child(4) .micon{background:#F5E9ED;color:var(--wine)}
.module b{font-size:16px;display:block}
.module small{font-size:11px;line-height:1.4;color:var(--muted);display:block;margin-top:4px}
.module.primary-module small{color:rgba(255,255,255,.82)}
.module svg{width:22px;height:22px}
.module-screen{position:fixed;inset:0;background:var(--bg);z-index:110;display:none;overflow:auto}
.module-screen.open{display:block}
.module-shell{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--bg);padding:18px 16px 28px}
.module-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--gd);display:grid;place-items:center;box-shadow:var(--shadow)}
.module-top h1{font-size:27px;margin:0}
.filter-row{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px 0 14px}
.filter-row::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:750;color:var(--muted);white-space:nowrap}
.chip.active{background:var(--g);border-color:var(--g);color:#fff}
.placeholder{padding:18px;text-align:center}
.placeholder b{display:block;font-size:18px}
.placeholder p{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0 0}
.form{display:grid;gap:11px}
.field label{display:block;font-size:11px;font-weight:750;color:#5D6765;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;outline:none}
.photo-field{border:1px dashed #A7C8C4;background:var(--gs);border-radius:18px;padding:14px;text-align:center}
.photo-field img{display:none;width:90px;height:90px;border-radius:24px;object-fit:cover;margin:0 auto 10px}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions button{flex:1}
.toast{position:fixed;left:50%;bottom:98px;transform:translate(-50%,18px);opacity:0;background:#1E2C2C;color:#fff;padding:11px 14px;border-radius:13px;font-size:12px;z-index:200;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:20px 0}.app{min-height:850px;border-radius:30px}.footer{bottom:20px;border-radius:0 0 30px 30px}.module-shell{min-height:850px;border-radius:30px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="brand-img" id="brandImg" alt="BARNEY & the Family"/>
    <button class="top-action" onclick="toast('Yeni bildirim yok')" aria-label="Bildirimler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
    </button>
  </header>

  <main>
    <section id="summary" class="screen active">
      <button class="dog-switch" onclick="openDogPicker()">
        <img class="avatar" id="sumDogPhoto"/>
        <div class="grow"><b id="sumDogName"></b><span id="sumDogMeta"></span></div>
        <span class="chev">›</span>
      </button>

      <div class="section">
        <div class="radar-card card">
          <div class="radar-top">
            <div><b>Yakınında</b><small>BARNEY Radar</small></div>
            <button class="link" onclick="openModule('radar')">Tam ekran</button>
          </div>
          <div class="map">
            <div class="you"></div>
            <button class="pin p1" onclick="openModule('radar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M5 19c.5-4 2-6 5-6s4.5 2 5 6m1-5c2.4 0 3.8 1.5 4 4"/></svg></button>
            <button class="pin p2" onclick="openModule('radar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-5.2 7-12a7 7 0 10-14 0c0 6.8 7 12 7 12z"/><circle cx="12" cy="9" r="2"/></svg></button>
            <button class="pin p3" onclick="openModule('radar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V8l8-5 8 5v12H4z"/><path d="M9 20v-6h6v6"/></svg></button>
            <button class="pin p4" onclick="openModule('radar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21a8 8 0 008-8V5h-4v6a4 4 0 01-8 0V5H4v8a8 8 0 008 8z"/></svg></button>
          </div>
          <div class="radar-counts"><span class="count">3 WalkBuddy</span><span class="count">5 köpek arkadaşı</span><span class="count">4 mekan</span></div>
          <button class="primary full" onclick="openModule('radar')">Radarı aç</button>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Bugün</h2></div>
        <div class="today" id="todayRows"></div>
      </div>
    </section>

    <section id="profile" class="screen">
      <h1 class="title">Profil</h1>
      <p class="sub">Köpeklerin ve hesabın. Başka hiçbir şey değil.</p>
      <div class="section card profile-hero">
        <img class="avatar lg" id="profilePhoto"/>
        <div class="grow">
          <h2 id="profileName"></h2>
          <p id="profileMeta"></p>
          <button class="primary" onclick="openEditDog()">Profili düzenle</button>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2 id="dogsTitle">Köpeğim</h2></div>
        <div class="dogs-strip" id="dogsStrip"></div>
      </div>

      <div class="section settings">
        <button class="setting" onclick="toast('Hesap ayarları prototipte')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>
          <b>Hesabım</b><span class="chev">›</span>
        </button>
        <button class="setting" onclick="toast('Bildirim tercihleri prototipte')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg>
          <b>Bildirimler</b><span class="chev">›</span>
        </button>
        <button class="setting" onclick="toast('Ayarlar prototipte')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1-2.9 2.9-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21h-4v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1-2.9-2.9.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3v-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1 2.9-2.9.1.1a1.6 1.6 0 001.8.3 1.6 1.6 0 001-1.5V3h4v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1 2.9 2.9-.1.1a1.6 1.6 0 00-.3 1.8 1.6 1.6 0 001.5 1h.1v4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
          <b>Ayarlar</b><span class="chev">›</span>
        </button>
      </div>
    </section>
  </main>

  <nav class="footer">
    <button class="nav active" data-nav="summary" onclick="go('summary')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3V11z"/></svg>
      <span>Özet</span>
    </button>
    <div class="super-wrap">
      <button class="super-btn" onclick="openSuper()" aria-label="BARNEY super app">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6.5" cy="8" r="2.3"/><circle cx="10" cy="5.4" r="2.2"/><circle cx="14" cy="5.4" r="2.2"/><circle cx="17.5" cy="8" r="2.3"/><path d="M12 10.2c-3.6 0-6.5 2.7-6.5 5.6 0 2.4 2 3.8 4.1 3.8 1.1 0 1.7-.5 2.4-.5s1.3.5 2.4.5c2.1 0 4.1-1.4 4.1-3.8 0-2.9-2.9-5.6-6.5-5.6z"/></svg>
      </button>
    </div>
    <button class="nav" data-nav="profile" onclick="go('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>
      <span>Profil</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeSheet()">
  <div class="sheet" id="sheet"><div class="grab"></div></div>
</div>

<div class="module-screen" id="moduleScreen">
  <div class="module-shell">
    <div class="module-top">
      <button class="back" onclick="closeModule()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="moduleTitle">Radar</h1>
    </div>
    <div id="moduleBody"></div>
  </div>
</div>

let state=(()=>{try{return JSON.parse(localStorage.getItem('barneySuperAppV1'))||structuredClone(base)}catch{return structuredClone(base)}})();
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('barneySuperAppV1',JSON.stringify(state))}
function dog(){return state.dogs.find(d=>d.id===state.activeDog)||state.dogs[0]}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function go(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));
  document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===id));
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function icon(type){
 const icons={
 food:'<path d="M5 4h14l-1 16H6L5 4zM8 8h8"/>',
 care:'<path d="M12 21s-8-4.7-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6.3-8 11-8 11z"/>',
 vet:'<path d="M12 21a8 8 0 008-8V5h-4v6a4 4 0 01-8 0V5H4v8a8 8 0 008 8z"/>'
 };
 return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+icons[type]+'</svg>'
}
function render(){
  $('brandImg').src=logoData;
  const d=dog();
  $('sumDogPhoto').src=d.photo;
  $('sumDogName').textContent=d.name;
  $('sumDogMeta').textContent=d.breed+' · '+String(d.kg).replace('.',',')+' kg';
  $('profilePhoto').src=d.photo;
  $('profileName').textContent=d.name;
  $('profileMeta').textContent=d.breed+' · '+d.sex+' · '+d.age+' · '+String(d.kg).replace('.',',')+' kg';
  $('dogsTitle').textContent=state.dogs.length>1?'Köpeklerim':'Köpeğim';
  $('dogsStrip').innerHTML=state.dogs.map(x=>'<button class="dog-mini '+(x.id===state.activeDog?'active':'')+'" onclick="selectDog('+x.id+')"><img src="'+x.photo+'"><span>'+x.name+'</span></button>').join('')+
  '<button class="dog-mini" onclick="openAddDog()"><span class="add-dog"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span><span>Köpek ekle</span></button>';

  $('todayRows').innerHTML=
  '<button class="today-row" onclick="openModule(\'food\')"><span class="ico">'+icon('food')+'</span><div class="grow"><b>Mama</b><small>Royal Canin · yaklaşık 12 gün kaldı</small></div><span class="chev">›</span></button>'+
  '<button class="today-row" onclick="openModule(\'care\')"><span class="ico">'+icon('care')+'</span><div class="grow"><b>Bakım</b><small>Son kilo '+String(d.kg).replace('.',',')+' kg</small></div><span class="chev">›</span></button>'+
  '<button class="today-row" onclick="openModule(\'care\')"><span class="ico">'+icon('vet')+'</span><div class="grow"><b>Veteriner</b><small>Sonraki ziyaret 26 Eylül</small></div><span class="chev">›</span></button>';
}
function openSheet(content){
  $('sheet').innerHTML='<div class="grab"></div>'+content;
  $('overlay').classList.add('open');
}
function closeSheet(){$('overlay').classList.remove('open')}
function openDogPicker(){
  openSheet('<h3>Köpek seç</h3><p class="sub">Özet ve takip bilgileri seçtiğin köpeğe göre değişir.</p><div class="settings">'+
  state.dogs.map(d=>'<button class="setting" onclick="selectDog('+d.id+');closeSheet()"><img class="avatar sm" src="'+d.photo+'"><div><b>'+d.name+'</b><div class="sub" style="margin:2px 0 0">'+d.breed+'</div></div><span class="chev">›</span></button>').join('')+
  '</div>');
}
function selectDog(id){state.activeDog=id;save();render()}
function openSuper(){
  openSheet('<h3>BARNEY</h3><p class="sub">Köpeğin için ihtiyacın olan her şey burada.</p><div class="super-grid">'+
  moduleCard('radar','Radar','Yakındakileri keşfet',true)+
  moduleCard('care','Bakım','Sağlık ve bakım takibi')+
  moduleCard('services','Hizmetler','Güvendiğin kişileri bul')+
  moduleCard('food','Mama','Takip et, doğru zamanda al')+
  '</div>');
}
function moduleCard(k,t,s,main=false){
  const p={
    radar:'<path d="M12 3a9 9 0 109 9M12 12l6-6M12 12h7"/>',
    care:'<path d="M12 21s-8-4.7-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6.3-8 11-8 11z"/>',
    services:'<path d="M4 20v-8h16v8M7 12V7a5 5 0 0110 0v5"/>',
    food:'<path d="M5 4h14l-1 16H6L5 4zM8 8h8"/>'
  }[k];
  return '<button class="module '+(main?'primary-module':'')+'" onclick="closeSheet();openModule(\''+k+'\')"><span class="micon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+p+'</svg></span><div><b>'+t+'</b><small>'+s+'</small></div></button>'
}
function openModule(k){
  const titles={radar:'Radar',care:'Bakım',services:'Hizmetler',food:'Mama'};
  $('moduleTitle').textContent=titles[k];
  $('moduleBody').innerHTML=moduleContent(k);
  $('moduleScreen').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModule(){$('moduleScreen').classList.remove('open');document.body.style.overflow=''}

  if(k==='care') return '<div class="card placeholder"><b>Bakım</b><p>Kilo, aşılar, ilaçlar, veteriner ziyaretleri ve grooming geçmişi burada olacak. Bu turda detay ekranını bilerek açmıyoruz.</p></div>';
  if(k==='services') return '<div class="card placeholder"><b>Hizmetler</b><p>Walker, sitter, pet taksi, eğitmen ve pansiyon sağlayıcıları burada olacak. Bu turda detay ekranını bilerek açmıyoruz.</p></div>';
  return '<div class="card placeholder"><b>Mama</b><p>Paket kilosu, açılış tarihi, günlük tüketim, kalan miktar, fiyat takibi ve sipariş burada olacak. Bu turda detay ekranını bilerek açmıyoruz.</p></div>';
}
function openAddDog(){
  state.tempPhoto=null;
  openSheet('<h3>Köpek ekle</h3><p class="sub">Sadece temel bilgiler.</p>'+
  '<div class="photo-field"><img id="newPhotoPreview"><input id="photoInput" type="file" accept="image/*" style="display:none" onchange="readPhoto(this)"><button class="secondary" onclick="photoInput.click()">Fotoğraf ekle</button></div>'+
  '<div class="form" style="margin-top:12px"><div class="field"><label>İsim</label><input id="newName" placeholder="Örn. Luna"></div><div class="field"><label>Irk</label><input id="newBreed" placeholder="Örn. Golden Retriever"></div><div class="field"><label>Doğum tarihi</label><input id="newBirth" type="date"></div><div class="field"><label>Cinsiyet</label><select id="newSex"><option>Erkek</option><option>Dişi</option></select></div><div class="field"><label>Kilo</label><input id="newKg" inputmode="decimal" placeholder="Örn. 10,4"></div></div>'+
  '<div class="sheet-actions"><button class="secondary" onclick="closeSheet()">Vazgeç</button><button class="primary" onclick="saveDog()">Kaydet</button></div>');
}
function readPhoto(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();r.onload=e=>{state.tempPhoto=e.target.result;const p=$('newPhotoPreview');p.src=state.tempPhoto;p.style.display='block'};r.readAsDataURL(f)
}
function saveDog(){
  const name=$('newName').value.trim(),breed=$('newBreed').value.trim(),kg=parseFloat($('newKg').value.replace(',','.'));
  if(!name||!breed||!kg)return toast('İsim, ırk ve kilo gerekli');
  const id=Math.max(0,...state.dogs.map(d=>d.id))+1;
  state.dogs.push({id,name,breed,sex:$('newSex').value,age:'',kg,birth:$('newBirth').value,photo:state.tempPhoto||dogPhotos[(id-1)%dogPhotos.length]});
  state.activeDog=id;state.tempPhoto=null;save();closeSheet();render();toast('Köpek eklendi');
}
function openEditDog(){
  const d=dog();
  openSheet('<h3>Profili düzenle</h3><div class="form"><div class="field"><label>İsim</label><input id="editName" value="'+d.name+'"></div><div class="field"><label>Irk</label><input id="editBreed" value="'+d.breed+'"></div><div class="field"><label>Kilo</label><input id="editKg" value="'+String(d.kg).replace('.',',')+'"></div></div><div class="sheet-actions"><button class="secondary" onclick="closeSheet()">Vazgeç</button><button class="primary" onclick="saveEditDog()">Kaydet</button></div>');
}
function saveEditDog(){
 const d=dog(),kg=parseFloat($('editKg').value.replace(',','.'));
 d.name=$('editName').value.trim()||d.name;d.breed=$('editBreed').value.trim()||d.breed;if(kg)d.kg=kg;
 save();closeSheet();render();toast('Profil güncellendi');
}
render();
</script>
</body>
</html>
